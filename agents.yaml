agents:
  planner:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "/plan Analyze the issue from stdin and provide a plan.md file."
    stdin: "issue.json"
    output_file: "plan.md"
    sandbox: "workspace-write"
    env:
      CODEX_API_KEY: "${OPENAI_API_KEY}"

  implementer:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "Implement the following plan in the codebase."
    stdin: "plan.md"
    output_file: "implementation_report.json"
    sandbox: "workspace-write"
    env:
      CODEX_API_KEY: "${OPENAI_API_KEY}"

  tester:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "Run tests based on the implementation provided."
    stdin: "implementation_report.json"
    output_file: "test_results.json"
    sandbox: "workspace-write"
    env:
      CODEX_API_KEY: "${OPENAI_API_KEY}"
