agents:
  planner:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "/plan Analyze the issue from stdin, provide a plan.md file to implement the issue if it is clear enough, otherwise mark the issue as insufficient input. Return the output in the requested structured schema"
    stdin: "issue.json"
    structured: "planner-result.json"
    sandbox: "workspace-write"

  implementer:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "Implement the plan provided on stdin. Return the requested structured result. On success, include implementation_report.json as a text output summarizing the changes and verification performed."
    stdin: "plan.md"
    output_file: "implementation_report.json"
    structured: "implementer-result.json"
    sandbox: "workspace-write"

  tester:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "Test the implementation described on stdin. Return the requested structured result. On success, include test_results.json as a text output summarizing the tests and results."
    stdin: "implementation_report.json"
    output_file: "test_results.json"
    structured: "tester-result.json"
    sandbox: "workspace-write"

  reviewer:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "Review the pull request provided on stdin and return the requested structured result."
    stdin: "pull-request.json"
    structured: "pr-review_results.json"
    sandbox: "workspace-write"
