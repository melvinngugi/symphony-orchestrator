agents:
  planner:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "/plan Analyze the issue from stdin, provide a plan.md file to implement the issue if it is clear enough, otherwise mark the issue as insufficient input. Return the output in the requested structured schema"
    stdin: "issue.json"
    structured: "planner-result.json"
    required_outputs:
      success:
        - "plan.md"
    sandbox: "workspace-write"

  implementer:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "Implement the request provided as JSON on stdin. Work from the existing repository state rather than recreating completed work. Follow the original plan, and when reviewFeedback is present, prioritize unresolved pull-request comments and required changes for the current source commit. Return the requested structured result. On success, include implementation_report.json as a text output summarizing the changes and verification performed."
    stdin: "implementation-context.json"
    refresh_stdin: true
    output_file: "implementation_report.json"
    structured: "implementer-result.json"
    required_outputs:
      success:
        - "implementation_report.json"
    sandbox: "workspace-write"

  tester:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "Test the implementation described on stdin. Return the requested structured result. On success, include test_results.json as a text output summarizing the tests and results."
    stdin: "implementation_report.json"
    output_file: "test_results.json"
    structured: "tester-result.json"
    required_outputs:
      success:
        - "test_results.json"
    sandbox: "workspace-write"

  reviewer:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "--output-last-message"
      - "{structured}"
      - "Review the pull request provided on stdin and return the requested structured result. Return status success only when there are no findings that require a code or configuration change. If any finding requires remediation, including any finding described as blocking or assigned priority P0, P1, or P2, return status blocked and summarize every required change clearly in neededClarifications. Keep message concise and readable because Symphony publishes it to Jira and Bitbucket. Return an empty outputs array; review feedback is persisted as pull-request comments rather than review.json. A passing build or test suite does not override review findings."
    stdin: "pull-request.json"
    structured: "pr-review_results.json"
    sandbox: "workspace-write"
