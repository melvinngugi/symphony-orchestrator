agents:
  planner:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "--output-schema"
      - "$SYMPHONY_HOME/agent-output-schema.json"
      - "/plan Analyze the issue from stdi, provide a plan.md file if the issue is clear enough, otherwise mark the issue as insufficient input. Return the output in the requested structured schema"
    stdin: "issue.json"
    output_file: "plan.md"
    sandbox: "workspace-write"
    env:
      - "CODEX_API_KEY"

  implementer:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "Implement the following plan in the codebase."
    stdin: "plan.md"
    output_file: "implementation_report.json"
    sandbox: "workspace-write"
    env:
      - "CODEX_API_KEY"

  tester:
    command: "codex"
    args:
      - "exec"
      - "--ephemeral"
      - "--sandbox"
      - "{sandbox}"
      - "Run tests based on the implementation provided."
    stdin: "implementation_report.json"
    output_file: "test_results.json"
    sandbox: "workspace-write"
    env:
      - "CODEX_API_KEY"
